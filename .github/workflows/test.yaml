name: Test
on:
  - push

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          checkout: 'false'
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix develop -c npm run test